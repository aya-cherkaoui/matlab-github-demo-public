# Azure ML — Déploiement du modèle ONNX sur l'endpoint managé
# =========================================================================
# Configure le déploiement : modèle, environnement, compute, scaling.
# =========================================================================

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: matlab-signal-v1
endpoint_name: matlab-signal-classifier
model:
  name: matlab-signal-classifier-onnx
  version: 1
  path: ../models/signal_classifier.onnx
  type: custom_model
  description: "Modèle LSTM de classification de signaux, entraîné en MATLAB, exporté en ONNX"

code_configuration:
  code: ./scoring
  scoring_script: score.py

environment:
  image: mcr.microsoft.com/azureml/onnxruntime:latest
  conda_file: ./scoring/conda.yml

instance_type: Standard_DS2_v2
instance_count: 1

request_settings:
  request_timeout_ms: 3000
  max_concurrent_requests_per_instance: 10

liveness_probe:
  initial_delay: 30
  period: 10

readiness_probe:
  initial_delay: 30
  period: 10
